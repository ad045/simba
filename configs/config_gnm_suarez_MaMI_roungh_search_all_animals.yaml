

# ATTENTION: CURRENTLY IN CHANGE!!!! 

experiment:
  experiment_type: gnm_sweep
  type: gnm_sweep
  name: 51_suarez_MaMI_100_rough_search_testing
  animal: 220
  num_runs: 10
  compare_to_connectome_of_distance_matrix: true
  average_connectomes: true
  elaborate_analysis: true
  compare_to_all_individual_empirical_connectomes: true #  false # not sure if this currently does anything....
  
  search:
    method: random
    n_samples: 100
  
  wandb:
    enabled: false
    project: GNM_project
  
  compare_rules: true
  fit_weights: true

# Pipeline execution flags - control which steps run
pipeline:
  run_experiment: true
  run_evaluation: true
  evaluate_empirical_connectomes: true
  extract_best_parameters: true
  save_matches: true
  create_visualizations: true
  
  # Specific settings for each step
  experiment:
    num_runs: 20 # 300
  
  evaluation:
    reference_csv_name: null  # If null, uses the experiment's all_metrics CSV
    checkpoint_interval: 100
  
  empirical_analysis:
    modes:
      - binarized
      - weighted_original_density
    esn_params:
      # density: 10
      spectral_radius: 0.9
      n_lags: 50
      train_len: 5000
      test_len: 1000
      n_runs: 50
      input_scaling: 1.0
      regression_method: pinv
      n_transient: 100
      leak_rate: 1.0
      bias: 0.0
      random_state: 42
  
  visualization:
    color_by: order  # Options: family, genus, species, order, phylogenetic_group
    label_by: name   # Options: name, common_name, or null
    plot_individual_connectomes: true
    normalize_aspect: true
    lags_to_plot: [1, 2, 3, 4, 5, 6, 10, 20, 49]
    metrics_to_plot:
      - MaxCriteria
      - avg_communicability
      - global_efficiency
      - modularity
      - avg_clustering
      - avg_degree
      - transitivity
      - avg_edge_distance
      - char_path_length
      - richclub_n_edges
      - richclub_avg_length
      - mc_mean
      - mc_std
      - wiring_cost
      - mean_mc_divided_by_wiring_cost
      - mc_5_divided_by_wiring_cost

data:
  dataset_name: suarez_MaMI_dataset
  connectome_resolution: 100
  density: 10
  
  # Paths are now relative to project root
  paths:
    project_root: /Users/adrian/Documents/01_projects/14_4D_lab/14_4D_lab_code
    animal_metadata: data/preprocessed/suarez_MaMI_dataset/04_further_info/names_of_animals_with_preprocessed_connectomes_100.csv

gnm:
  eta_range: [-11.0, 10.0]
  gamma_range: [-1, 1.0]
  lambda: [0.0]
  # n_eta: 100
  # n_gamma: 100
  generative_rules_to_test:
    - matching_index
  num_simulations: 10
  evaluation_metrics:
    - degree_ks
    - clustering_ks
    - edge_length_ks
    - betweenness_ks
  weight_criterion: distance_weighted_communicability
  alpha: 0.01
  distance_relationship_type: ["powerlaw"]
  preferential_relationship_type: ["powerlaw"]
  heterochronicity_relationship_type: ["powerlaw"]

dyn_gnm:
  dynamic_fitness_metric: mc_mean

esn:
  spectral_radius: 0.9
  input_scaling: 1.0
  train_len: 5000
  regression_method: pinv
  n_runs: 50
  n_lags: 50
  test_len: 1000
  leak_rate: 1.0
  bias: 0.0
  n_transient: 0
  random_state: 42

compute:
  device: cpu
  n_workers: -1
  timing_flag: true
  random_seed: 42

output:
  figure_format: pdf
  verbosity: INFO