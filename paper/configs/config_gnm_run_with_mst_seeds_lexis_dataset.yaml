experiment:
  experiment_type: gnm_sweep
  type: gnm_sweep
  name: 12_mst_25 # 10000 # _no_ring_sweeps
  animal: 444 # placeholder
  calculate_energy: true # false # will be calculated later.. 
  average_connectomes: true
  elaborate_analysis: true
  calculate_energies_of_all_individual_connectomes: false
  search:
    method: grid
    n_samples: 25 # 10000 # 10000
data:
  dataset_name: lexis_data # suarez_MaMI_dataset # hcp_schaefer_100_dataset
  connectome_resolution: 50
  density: 10
  paths:
    project_root: .
    # animal_metadata: ./data/preprocessed/suarez_MaMI_dataset/04_further_info/names_of_animals_with_preprocessed_connectomes_50_processed.csv
gnm:
  eta_range:
  - -8.0
  - 3.0
  gamma_range:
  - -0.1
  - 1.0
  lambda:
  - 0.0
  generative_rules_to_test:
  - matching_index
  num_simulations: 10
  evaluation_metrics:
  - degree_ks
  - clustering_ks
  - edge_length_ks
  - betweenness_ks
  weight_criterion: distance_weighted_communicability
  alpha: 0.01
  distance_relationship_type:
  - powerlaw
  preferential_relationship_type:
  - powerlaw
  heterochronicity_relationship_type:
  - powerlaw
  seed_params: 
    seed_adjacency_matrices: ./data/preprocessed/seeds/mst_schaeffer.npy
    seed_id: 444 # placeholder
# dyn_gnm:
#   dynamic_fitness_metric: mc_mean
esn:
  spectral_radius: 0.9
  input_scaling: 1.0 # 1.0
  train_len: 5000
  regression_method: pinv
  n_runs: 50
  n_lags: 50
  test_len: 1000
  leak_rate: 1.0
  bias: 0.0
  n_transient: 0
  random_state: 42
compute:
  device: cpu
  n_workers: -1 # -1
  timing_flag: true
  random_seed: 42
output:
  figure_format: pdf
  verbosity: INFO
